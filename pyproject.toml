[project]
name = "browser-use-clef-flash"
version = "0.1.0"
description = "A Cloudflare Workers AI browser agent using Clef decisions and GPT-OSS text generation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Browser Use" }]
maintainers = [{ name = "Sid Mohan" }]
keywords = ["browser-automation", "cloudflare", "workers-ai", "clef"]
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.urls]
Repository = "https://github.com/sidmohan0/browser-use-clef-flash"
Documentation = "https://github.com/sidmohan0/browser-use-clef-flash#readme"
Issues = "https://github.com/sidmohan0/browser-use-clef-flash/issues"
Upstream = "https://github.com/browser-use/jev-ultrafast"

[project.scripts]
jev = "jev_ultrafast.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_ultrafast"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
